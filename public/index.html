<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>juniqlog</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262b36; --fg:#e6e8ec; --dim:#8b93a3; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; background:#0f1115; color:#e6e8ec; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid #262b36; font-weight:600; }
  #timeline { max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .entry { background:#181b22; border:1px solid #262b36; border-radius:10px; padding:10px 12px; }
  .time { font-size:12px; color:#8b93a3; }
  .datehead { max-width:720px; margin:14px auto 2px; padding:0 4px; font-size:13px;
              font-weight:600; color:#9fb4d6; border-bottom:1px solid #262b36; }
  .datehead:first-child { margin-top:0; }
  .body { white-space:pre-wrap; word-break:break-word; margin:2px 0 6px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; background:#232833; border:1px solid #313846; color:#9fb4d6;
          border-radius:999px; padding:1px 9px; cursor:pointer; }
  .chip.add { color:#6b7484; }
  #composer { position:sticky; bottom:0; background:#0f1115; border-top:1px solid #262b36; padding:12px 16px; }
  #composer .inner { max-width:720px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; background:#181b22; color:#e6e8ec; border:1px solid #262b36;
             border-radius:10px; padding:9px 11px; font:inherit; min-height:42px; max-height:160px; }
  button.send { background:#6ea8fe; color:#0f1115; border:0; border-radius:10px; padding:0 16px; font-weight:600; cursor:pointer; }
  .filter { max-width:720px; margin:8px auto 0; padding:0 16px; font-size:13px; color:#8b93a3; }
  .filter b { color:#9fb4d6; } .filter a { color:#6ea8fe; cursor:pointer; }
</style>
</head>
<body>
<header>juniqlog</header>
<div class="filter" id="filter" hidden></div>
<div id="timeline"></div>

<div id="composer">
  <div class="inner">
    <textarea id="input" placeholder="지금 생각을 남기세요… (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button class="send" id="send">전송</button>
  </div>
</div>

<script type="module">
const KEY = 'juniqlog.entries'
let entries = JSON.parse(localStorage.getItem(KEY) || '[]')
let filterTag = null

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()))
const save = () => localStorage.setItem(KEY, JSON.stringify(entries))

function createEntry(body, tags = []) {
  if (body.trim() === '') throw new Error('빈 로그는 만들 수 없다')
  return { id: uid(), body, createdAt: new Date().toISOString(), tags: [...tags] }
}

const p = n => String(n).padStart(2,'0')

function timeOf(iso) {
  const d = new Date(iso)
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
}

function dateOf(iso) {
  const d = new Date(iso)
  const days = ['일','월','화','수','목','금','토']
  return `${d.getFullYear()}. ${p(d.getMonth()+1)}. ${p(d.getDate())}. (${days[d.getDay()]})`
}

function render() {
  const tl = document.getElementById('timeline')
  const fb = document.getElementById('filter')
  if (filterTag) {
    fb.hidden = false
    fb.innerHTML = `태그 <b>#${filterTag}</b> 모아보기 · <a id="clear">전체 보기</a>`
    fb.querySelector('#clear').onclick = () => { filterTag = null; render() }
  } else { fb.hidden = true }

  const list = [...entries]
    .filter(e => !filterTag || e.tags.includes(filterTag))
    .sort((a,b) => b.createdAt.localeCompare(a.createdAt))

  tl.innerHTML = ''
  let curDate = null
  for (const e of list) {
    const d = dateOf(e.createdAt)
    if (d !== curDate) {
      curDate = d
      const h = document.createElement('div')
      h.className = 'datehead'; h.textContent = d
      tl.appendChild(h)
    }
    const el = document.createElement('div')
    el.className = 'entry'
    el.innerHTML = `<div class="time">${timeOf(e.createdAt)}</div>
      <div class="body"></div><div class="tags"></div>`
    el.querySelector('.body').textContent = e.body
    const tags = el.querySelector('.tags')
    for (const t of e.tags) {
      const c = document.createElement('span')
      c.className = 'chip'; c.textContent = '#' + t
      c.onclick = () => { filterTag = t; render() }
      tags.appendChild(c)
    }
    const add = document.createElement('span')
    add.className = 'chip add'; add.textContent = '+태그'
    add.onclick = () => {
      const t = prompt('태그')?.trim()
      if (t && !e.tags.includes(t)) { e.tags.push(t); save(); render() }
    }
    tags.appendChild(add)
    tl.appendChild(el)
  }
}

function submit() {
  const ta = document.getElementById('input')
  const text = ta.value
  if (text.trim() === '') return
  entries.push(createEntry(text))
  save(); ta.value=''; ta.style.height='42px'; render()
}

document.getElementById('send').onclick = submit
const ta = document.getElementById('input')
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit() }
})
ta.addEventListener('input', () => {
  ta.style.height = '42px'; ta.style.height = Math.min(ta.scrollHeight,160)+'px'
})

render()
</script>
</body>
</html>
