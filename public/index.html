<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>juniqlog</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f1115; color:#e6e8ec; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid #262b36; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  header .out { font-size:12px; color:#6b7484; cursor:pointer; background:none; border:0; }
  #timeline { max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .entry { background:#181b22; border:1px solid #262b36; border-radius:10px; padding:10px 12px; }
  .time { font-size:12px; color:#8b93a3; }
  .datehead { max-width:720px; margin:14px auto 2px; padding:0 4px; font-size:13px;
              font-weight:600; color:#9fb4d6; border-bottom:1px solid #262b36; }
  .datehead:first-child { margin-top:0; }
  .body { white-space:pre-wrap; word-break:break-word; margin:2px 0 6px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; background:#232833; border:1px solid #313846; color:#9fb4d6;
          border-radius:999px; padding:1px 9px; cursor:pointer; }
  .chip.add { color:#6b7484; }
  #composer { position:sticky; bottom:0; background:#0f1115; border-top:1px solid #262b36; padding:12px 16px; }
  #composer .inner { max-width:720px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; background:#181b22; color:#e6e8ec; border:1px solid #262b36;
             border-radius:10px; padding:9px 11px; font:inherit; min-height:42px; max-height:160px; }
  button.send { background:#6ea8fe; color:#0f1115; border:0; border-radius:10px; padding:0 16px; font-weight:600; cursor:pointer; }
  .filter { max-width:720px; margin:8px auto 0; padding:0 16px; font-size:13px; color:#8b93a3; }
  .filter b { color:#9fb4d6; } .filter a { color:#6ea8fe; cursor:pointer; }
  #auth { max-width:360px; margin:18vh auto; padding:24px; text-align:center; }
  #auth h1 { font-size:22px; margin:0 0 4px; }
  #auth p { color:#8b93a3; font-size:13px; margin:0 0 18px; }
  #auth input { width:100%; background:#181b22; color:#e6e8ec; border:1px solid #262b36;
                border-radius:10px; padding:11px; font:inherit; margin-bottom:10px; }
  #auth button { width:100%; background:#6ea8fe; color:#0f1115; border:0; border-radius:10px; padding:11px; font-weight:600; cursor:pointer; }
  #auth .msg { margin-top:12px; font-size:13px; color:#9fb4d6; min-height:18px; }
</style>
</head>
<body>

<div id="auth" hidden>
  <h1>juniqlog</h1>
  <p>이메일로 로그인 링크를 받습니다. 최초 1회면 이후 로그인 상태가 유지됩니다.</p>
  <input id="email" type="email" placeholder="이메일" autocomplete="email">
  <button id="login">로그인 링크 받기</button>
  <div class="msg" id="authmsg"></div>
</div>

<div id="app" hidden>
  <header>juniqlog <button class="out" id="logout">로그아웃</button></header>
  <div class="filter" id="filter" hidden></div>
  <div id="timeline"></div>
  <div id="composer">
    <div class="inner">
      <textarea id="input" placeholder="지금 생각을 남기세요… (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button class="send" id="send">전송</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const SUPABASE_URL = 'https://zuvifgiiahbypxsvnzvg.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1dmlmZ2lpYWhieXB4c3ZuenZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4NTMwNDQsImV4cCI6MjEwMDQyOTA0NH0.sVexgnQmy0YRcg3bjq0ThHB8sgPLtn1X3SDDyUbeG18'
const sb = createClient(SUPABASE_URL, SUPABASE_ANON)

let entries = []
let filterTag = null

const $ = id => document.getElementById(id)
const p = n => String(n).padStart(2,'0')

function timeOf(iso) {
  const d = new Date(iso)
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
}
function dateOf(iso) {
  const d = new Date(iso)
  const days = ['일','월','화','수','목','금','토']
  return `${d.getFullYear()}. ${p(d.getMonth()+1)}. ${p(d.getDate())}. (${days[d.getDay()]})`
}

/* ---- auth ---- */
function showAuth() { $('auth').hidden = false; $('app').hidden = true }
function showApp()  { $('auth').hidden = true;  $('app').hidden = false }

async function refreshAuth() {
  const { data: { session } } = await sb.auth.getSession()
  if (session) { showApp(); await load() } else { showAuth() }
}
sb.auth.onAuthStateChange(() => refreshAuth())

$('login').onclick = async () => {
  const email = $('email').value.trim()
  if (!email) return
  $('authmsg').textContent = '전송 중…'
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: location.origin + location.pathname }
  })
  $('authmsg').textContent = error ? ('오류: ' + error.message)
    : '메일함을 확인해 링크를 누르세요.'
}
$('logout').onclick = async () => { await sb.auth.signOut() }

/* ---- data ---- */
async function load() {
  const { data, error } = await sb.from('entries')
    .select('*').order('created_at', { ascending: false })
  if (error) { console.error(error); return }
  entries = data || []
  render()
}

async function submit() {
  const ta = $('input')
  const body = ta.value
  if (body.trim() === '') return
  ta.value = ''; ta.style.height = '42px'
  const { error } = await sb.from('entries').insert({ body })
  if (error) { console.error(error); alert('저장 실패: ' + error.message); return }
  await load()
}

async function addTag(entry, tag) {
  if (entry.tags.includes(tag)) return
  const tags = [...entry.tags, tag]
  const { error } = await sb.from('entries').update({ tags }).eq('id', entry.id)
  if (error) { console.error(error); return }
  await load()
}

/* ---- render ---- */
function render() {
  const tl = $('timeline'), fb = $('filter')
  if (filterTag) {
    fb.hidden = false
    fb.innerHTML = `태그 <b>#${filterTag}</b> 모아보기 · <a id="clear">전체 보기</a>`
    fb.querySelector('#clear').onclick = () => { filterTag = null; render() }
  } else fb.hidden = true

  const list = entries.filter(e => !filterTag || e.tags.includes(filterTag))
  tl.innerHTML = ''
  let curDate = null
  for (const e of list) {
    const d = dateOf(e.created_at)
    if (d !== curDate) {
      curDate = d
      const h = document.createElement('div')
      h.className = 'datehead'; h.textContent = d
      tl.appendChild(h)
    }
    const el = document.createElement('div')
    el.className = 'entry'
    el.innerHTML = `<div class="time">${timeOf(e.created_at)}</div>
      <div class="body"></div><div class="tags"></div>`
    el.querySelector('.body').textContent = e.body
    const tags = el.querySelector('.tags')
    for (const t of e.tags) {
      const c = document.createElement('span')
      c.className = 'chip'; c.textContent = '#' + t
      c.onclick = () => { filterTag = t; render() }
      tags.appendChild(c)
    }
    const add = document.createElement('span')
    add.className = 'chip add'; add.textContent = '+태그'
    add.onclick = () => {
      const t = prompt('태그')?.trim()
      if (t) addTag(e, t)
    }
    tags.appendChild(add)
    tl.appendChild(el)
  }
}

/* ---- input UX ---- */
$('send').onclick = submit
const ta = $('input')
ta.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit() }
})
ta.addEventListener('input', () => {
  ta.style.height = '42px'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'
})
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !$('app').hidden) load()
})

refreshAuth()
</script>
</body>
</html>
