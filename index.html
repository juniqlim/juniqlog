<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>juniqlog</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#0f1115; color:#e6e8ec; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid #262b36; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  header .out { font-size:12px; color:#6b7484; cursor:pointer; background:none; border:0; }
  #app { display:flex; flex-direction:column; min-height:100vh; }
  #timeline { flex:1; width:100%; max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .entry { background:#181b22; border:1px solid #262b36; border-radius:10px; padding:10px 12px; }
  .time { font-size:12px; color:#8b93a3; }
  .head { display:flex; justify-content:space-between; align-items:center; }
  .actions { display:flex; gap:2px; }
  .act { background:none; border:0; font-size:14px; line-height:1; color:#414958;
         cursor:pointer; padding:2px 5px; border-radius:6px; }
  .act:hover { color:#9fb4d6; background:#232833; }
  .del { font-size:16px; }
  .tags { margin-top:6px; }
  .datehead { max-width:720px; margin:14px auto 2px; padding:0 4px; font-size:13px;
              font-weight:600; color:#9fb4d6; border-bottom:1px solid #262b36; }
  .datehead:first-child { margin-top:0; }
  .body { white-space:pre-wrap; word-break:break-word; margin:2px 0 6px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; background:#232833; border:1px solid #313846; color:#9fb4d6;
          border-radius:999px; padding:1px 9px; cursor:pointer; }
  .chip.add { color:#6b7484; }
  #composer { position:sticky; bottom:0; background:#0f1115; border-top:1px solid #262b36; padding:12px 16px; }
  #composer .inner { max-width:720px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; background:#181b22; color:#e6e8ec; border:1px solid #262b36;
             border-radius:10px; padding:9px 11px; font:inherit; min-height:42px; max-height:160px; }
  button.send { background:#6ea8fe; color:#0f1115; border:0; border-radius:10px; padding:0 16px; font-weight:600; cursor:pointer; }
  .filter { max-width:720px; margin:8px auto 0; padding:0 16px; font-size:13px; color:#8b93a3; }
  .filter b { color:#9fb4d6; } .filter a { color:#6ea8fe; cursor:pointer; }
  #auth { max-width:360px; margin:18vh auto; padding:24px; text-align:center; }
  #auth h1 { font-size:22px; margin:0 0 4px; }
  #auth p { color:#8b93a3; font-size:13px; margin:0 0 18px; }
  #auth input { width:100%; background:#181b22; color:#e6e8ec; border:1px solid #262b36;
                border-radius:10px; padding:11px; font:inherit; margin-bottom:10px; }
  #auth button { width:100%; background:#6ea8fe; color:#0f1115; border:0; border-radius:10px; padding:11px; font-weight:600; cursor:pointer; }
  #auth button.google { background:#fff; color:#1f2328; margin-bottom:14px; }
  #auth .or { color:#6b7484; font-size:12px; margin-bottom:14px; }
  #auth .msg { margin-top:12px; font-size:13px; color:#9fb4d6; min-height:18px; }
</style>
</head>
<body>

<div id="auth" hidden>
  <h1>juniqlog</h1>
  <p>이메일로 로그인 링크를 받습니다. 최초 1회면 이후 로그인 상태가 유지됩니다.</p>
  <button id="google" class="google">Google로 로그인</button>
  <div class="or">또는</div>
  <input id="email" type="email" placeholder="이메일" autocomplete="email">
  <button id="login">로그인 링크 받기</button>
  <div class="msg" id="authmsg"></div>
</div>

<div id="app" hidden>
  <header>juniqlog <button class="out" id="logout">로그아웃</button></header>
  <div class="filter" id="filter" hidden></div>
  <div id="timeline"></div>
  <div id="composer">
    <div class="inner">
      <textarea id="input" placeholder="지금 생각을 남기세요… (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
      <button class="send" id="send">전송</button>
    </div>
  </div>
</div>

<script type="module" src="/src/app.ts"></script>
</body>
</html>
